replicaCount: 1

image:
  repository: ghcr.io/rkamradt/dccex-throttle
  tag: "main"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

ingress:
  enabled: true
  # Update to your actual Cloudflare-tunnelled hostname
  hostname: dccex.rkamradt.dev
  ingressClassName: traefik

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "200m"

env:
  - name: DCCEX_HOST
    value: "10.147.0.8"
  - name: DCCEX_PORT
    value: "2560"
