replicaCount: 1

image:
  repository: ghcr.io/rkamradt/javaman
  tag: "main"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 3001
  targetPort: 3001

# kubectl create secret generic javaman-secret -n javaman \
#   --from-literal=DATABASE_URL='postgresql://javaman_user:<password>@postgresql.postgresql.svc.cluster.local:5432/javamandb'
envSecret: javaman-secret

resources:
  requests:
    memory: 64Mi
    cpu: 25m
  limits:
    memory: 256Mi
    cpu: 250m
