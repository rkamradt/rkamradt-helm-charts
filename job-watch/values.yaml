image:
  repository: ghcr.io/rkamradt/job-watch
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

# CronJob schedule — every 4 hours
schedule: "0 */4 * * *"

# Name of the Kubernetes Secret containing:
#   MONGO_URI, GMAIL_USER, GMAIL_APP_PASSWORD, GMAIL_TO, ANTHROPIC_API_KEY
secretName: job-watch-secrets

# Optional secret containing Gmail OAuth2 credentials for discovery:
#   GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN
gmailCredsSecretName: job-watch-gmail-creds

# companies.yaml content — rendered into a ConfigMap and mounted at /config/
# The indented block below is the default; override in a private values file.
companiesYaml: |
  companies:
    - { name: Toast,       ats: greenhouse, slug: toast }
    - { name: Smartsheet,  ats: greenhouse, slug: smartsheet }
    - { name: Instacart,   ats: greenhouse, slug: instacart }
    - { name: Mattermost,  ats: greenhouse, slug: mattermost }
    - { name: "Hims & Hers", ats: ashby,   slug: hims-and-hers }
    - { name: Weave,       ats: ashby,      slug: weave }

  filter:
    title_include: [principal, staff, lead, architect, "senior staff"]
    title_exclude: [manager, director, intern, "data scientist", sales, recruiter, "business development", emea, apac, latam]
    boost_keywords: [kafka, kubernetes, "event-driven", platform, java, kotlin, " ai", llm, "machine learning"]

  screening:
    enabled: false
    model: claude-haiku-4-5-20251001
    candidate_profile: |
      20+ years of software engineering experience. Strong background in distributed systems,
      event-driven architecture (Kafka), Kubernetes, Java/Kotlin, and LLM/AI integration.
      Seeking principal, staff, or lead engineer roles at product companies. Remote US only.

  llm_scoring:
    enabled: true
    threshold: 70
    daily_cap: 200
    model: claude-haiku-4-5-20251001
    remote_us_required: true
    dealbreakers:
      - "on-site only"
      - "no remote"

  gmail_discovery:
    enabled: true
    auto_activate: false
    probe_rate_limit_delay: 2.0
    negative_cache_ttl_days: 30

  concurrency_limit: 3
  request_timeout_sec: 30

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 500m
