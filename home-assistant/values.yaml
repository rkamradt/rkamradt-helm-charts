replicaCount: 1

image:
  repository: ghcr.io/home-assistant/home-assistant
  tag: "2026.10.4"
  pullPolicy: IfNotPresent

service:
  # ClusterIP for in-cluster access (Wyoming services, smoke tests).
  # Tablets reach HA directly at http://<servy-lan-ip>:8123 via hostNetwork below.
  type: ClusterIP
  port: 8123
  targetPort: 8123

# hostNetwork binds HA directly to the node's LAN IP (192.168.4.36:8123).
# This is the access path for tablets; it also enables mDNS device discovery.
# dnsPolicy is guarded in the template — cluster DNS still works when true.
hostNetwork: true

persistence:
  size: 1Gi
  storageClass: local-path
  mountPath: /config

nodeSelector:
  kubernetes.io/hostname: servy

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
