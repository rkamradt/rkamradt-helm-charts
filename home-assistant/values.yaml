replicaCount: 1

image:
  repository: ghcr.io/home-assistant/home-assistant
  tag: "2026.10.4"
  pullPolicy: IfNotPresent

service:
  # LoadBalancer: K3s ServiceLB assigns servy's LAN IP as EXTERNAL-IP on port 8123.
  # Tablets reach Home Assistant at http://<EXTERNAL-IP>:8123
  type: LoadBalancer
  port: 8123
  targetPort: 8123

# false: use the LoadBalancer service for LAN access (cleaner, no host network sharing).
# Set to true only if mDNS device discovery is needed (Matter, Zigbee-over-IP).
hostNetwork: false

persistence:
  size: 1Gi
  storageClass: local-path
  mountPath: /config

nodeSelector:
  kubernetes.io/hostname: servy

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
