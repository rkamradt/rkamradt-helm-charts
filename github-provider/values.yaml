replicaCount: 1

image:
  repository: ghcr.io/rkamradt/github-provider
  tag: "main"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 3002
  targetPort: 3002

# Secret must contain:
#   KAFKA_BROKERS, MINIO_ENDPOINT, MINIO_ACCESS_KEY, MINIO_SECRET_KEY,
#   MINIO_BUCKET, MONGODB_URI, GITHUB_POLL_INTERVAL_MS, GITHUB_MAX_POLL_ATTEMPTS
envFrom:
  - secretRef:
      name: github-provider-secrets

resources:
  requests:
    memory: 64Mi
    cpu: 25m
  limits:
    memory: 128Mi
    cpu: 200m
