replicaCount: 1

image:
  repository: ghcr.io/rkamradt/github-provider
  tag: "main"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 3002
  targetPort: 3002

# github-provider-secrets must contain:
#   KAFKA_BROKERS, MINIO_BUCKET, GITHUB_POLL_INTERVAL_MS, GITHUB_MAX_POLL_ATTEMPTS
# minio-config must contain:
#   MINIO_ENDPOINT, MINIO_ACCESS_KEY, MINIO_SECRET_KEY
# mongo-config must contain:
#   MONGODB_URI
envFrom:
  - secretRef:
      name: github-provider-secrets
  - secretRef:
      name: minio-config
  - secretRef:
      name: mongo-config

resources:
  requests:
    memory: 64Mi
    cpu: 25m
  limits:
    memory: 128Mi
    cpu: 200m
