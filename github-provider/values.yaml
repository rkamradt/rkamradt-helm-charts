replicaCount: 1

image:
  repository: ghcr.io/rkamradt/github-provider
  tag: "main"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 3002
  targetPort: 3002

# Non-sensitive config rendered into a ConfigMap by this chart.
# Secrets (minio-config, mongo-config) must be created separately.
config:
  KAFKA_BROKERS: kafka.kafka.svc.cluster.local:9092
  MINIO_BUCKET: architectai-builds
  GITHUB_POLL_INTERVAL_MS: "10000"
  GITHUB_MAX_POLL_ATTEMPTS: "30"

envFrom:
  - configMapRef:
      name: github-provider-config
  - secretRef:
      name: minio-config
  - secretRef:
      name: mongo-config

resources:
  requests:
    memory: 64Mi
    cpu: 25m
  limits:
    memory: 128Mi
    cpu: 200m
