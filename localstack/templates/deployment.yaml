apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      enableServiceLinks: false
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: LOCALSTACK_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authSecretName }}
                  key: LOCALSTACK_AUTH_TOKEN
            {{- if .Values.services }}
            - name: SERVICES
              value: {{ .Values.services | quote }}
            {{- end }}
            - name: PERSISTENCE
              value: "1"
            # Run Lambda code in-process instead of spawning Docker containers.
            # Required for in-cluster use: the pod has no Docker socket.
            - name: LAMBDA_RUNTIME_EXECUTOR
              value: "local"
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /_localstack/health
              port: {{ .Values.service.targetPort }}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: {{ .Values.service.targetPort }}
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: {{ .Values.service.targetPort }}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Chart.Name }}-data
      {{- end }}
