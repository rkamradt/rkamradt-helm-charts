{{- /*
  Minimal ClusterRole for ArgoCD CRD read only.
  Pod/log access is granted per-namespace in role.yaml — not cluster-wide.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Chart.Name }}-argocd-reader
  labels:
    app: {{ .Chart.Name }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get"]
