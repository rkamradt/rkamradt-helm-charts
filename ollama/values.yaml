replicaCount: 1

image:
  repository: ollama/ollama
  tag: "0.35.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 11434
  targetPort: 11434

storage:
  size: 5Gi
  storageClassName: local-path

model:
  name: "llama3.2:3b-instruct-q4_K_M"

# Pin to the single node; update if the cluster grows.
nodeSelector:
  kubernetes.io/hostname: servy

resources:
  requests:
    memory: "4Gi"
    cpu: "2000m"
  limits:
    memory: "6Gi"

env:
  - name: OLLAMA_KEEP_ALIVE
    value: "24h"
