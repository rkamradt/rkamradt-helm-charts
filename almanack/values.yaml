replicaCount: 1

image:
  repository: ghcr.io/rkamradt/almanack
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

# Secret must be created manually in the almanack namespace.
# Required keys: ANTHROPIC_API_KEY, DB_URL
envSecret: almanack-secret

env:
  OLLAMA_URL: "http://ollama.llm.svc.cluster.local:11434"
  OLLAMA_EMBED_MODEL: "nomic-embed-text"
  OLLAMA_MODEL: "qwen3.5:4b"
  LLM_PROVIDER: "ollama"
  ANTHROPIC_MODEL: "claude-haiku-4-5-20251001"
  RETRIEVAL_TOP_K: "5"
  RETRIEVAL_MIN_SIMILARITY: "0.35"
  RATE_LIMIT_ASK: "5/minute"
  DAILY_SPEND_CAP_USD: "1.0"
  ESTIMATED_COST_PER_CALL: "0.002"

# Python startup is slow on this CPU-only node
resources:
  requests:
    memory: 128Mi
    cpu: 20m
  limits:
    memory: 256Mi
    cpu: 500m
