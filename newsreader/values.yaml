image:
  repository: ghcr.io/rkamradt/newsreader
  tag: "main"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

schedule: "7 * * * *"

# Secret must contain MONGO_USER, MONGO_PASS, and NEWSAPI_KEY
envSecret: newsreader-secret

env:
  MONGO_SERVER: mongodb.nr
  MONGO_PORT: "27017"

resources:
  requests:
    memory: 64Mi
    cpu: 25m
  limits:
    memory: 256Mi
    cpu: 250m
