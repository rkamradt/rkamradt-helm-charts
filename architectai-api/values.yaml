replicaCount: 1

image:
  repository: ghcr.io/rkamradt/architectai-api
  tag: "main"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# Non-sensitive config rendered into a ConfigMap by this chart.
# Secrets (minio-config, mongo-config) must be created separately.
config:
  AUTH0_ISSUER_BASE_URL: https://randyk.us.auth0.com/
  AUTH0_AUDIENCE: https://api.kamradtfamily.net
  FRONTEND_URL: https://architect.kamradtfamily.net
  KAFKA_BROKERS: kafka.kafka.svc.cluster.local:9092
  MINIO_BUCKET: architectai-builds

envFrom:
  - configMapRef:
      name: architectai-api-config
  - secretRef:
      name: minio-config
  - secretRef:
      name: mongo-config

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 250m
