replicaCount: 1

image:
  repository: ghcr.io/rkamradt/architectai-api
  tag: "main"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# architectai-api-config (ConfigMap) must contain:
#   AUTH0_ISSUER_BASE_URL, AUTH0_AUDIENCE, FRONTEND_URL, KAFKA_BROKERS, MINIO_BUCKET
# minio-config (Secret) must contain:
#   MINIO_ENDPOINT, MINIO_ACCESS_KEY, MINIO_SECRET_KEY
# mongo-config (Secret) must contain:
#   MONGODB_URI
envFrom:
  - configMapRef:
      name: architectai-api-config
  - secretRef:
      name: minio-config
  - secretRef:
      name: mongo-config

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 250m
