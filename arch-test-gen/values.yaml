replicaCount: 1

image:
  repository: ghcr.io/rkamradt/arch-test-gen
  tag: "main"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

# Non-sensitive config rendered into a ConfigMap.
# Secrets (minio-config, mongo-config) must be created in the namespace separately.
config:
  KAFKA_BROKERS: kafka.kafka.svc.cluster.local:9092
  MINIO_BUCKET: architectai-builds

envFrom:
  - configMapRef:
      name: arch-test-gen-config
  - secretRef:
      name: minio-config
  - secretRef:
      name: mongo-config

# Lighter than arch-code-gen: uses Haiku model with shorter sessions.
resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 250m
