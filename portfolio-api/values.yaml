replicaCount: 1

image:
  repository: ghcr.io/rkamradt/portfolio-api
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

envSecret: portfolio-api-secret

resources:
  requests:
    memory: 256Mi
    cpu: 50m
  limits:
    memory: 512Mi
    cpu: 500m

startupProbe:
  failureThreshold: 60
  periodSeconds: 5
