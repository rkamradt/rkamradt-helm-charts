replicaCount: 1

image:
  repository: infisical/infisical
  tag: "latest-postgres"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# kubectl create secret generic infisical-secret -n infisical \
#   --from-literal=ENCRYPTION_KEY='<32-char hex>' \
#   --from-literal=AUTH_SECRET='<random string>' \
#   --from-literal=DB_CONNECTION_URI='postgresql://infisical_user:<pw>@postgresql.postgresql.svc.cluster.local:5432/infisicaldb' \
#   --from-literal=REDIS_URL='redis://redis.redis.svc.cluster.local:6379' \
#   --from-literal=SITE_URL='https://secrets.kamradtfamily.net'
envSecret: infisical-secret

resources:
  requests:
    memory: 256Mi
    cpu: 50m
  limits:
    memory: 512Mi
    cpu: 500m
