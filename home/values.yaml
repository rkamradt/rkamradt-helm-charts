replicaCount: 1

image:
  repository: ghcr.io/rkamradt/home
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

env:
  OLLAMA_URL: "http://ollama.llm.svc.cluster.local:11434"
  OLLAMA_MODEL: "llama3.2:3b-instruct-q4_K_M"
  RATE_LIMIT_MAX: "10"

resources:
  requests:
    memory: 64Mi
    cpu: 10m
  limits:
    memory: 128Mi
    cpu: 200m
