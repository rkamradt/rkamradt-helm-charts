replicaCount: 1

image:
  repository: minio/minio
  tag: "RELEASE.2024-03-15T01-07-19Z"
  pullPolicy: IfNotPresent

auth:
  rootUser: minioadmin
  rootPassword: minioadmin

storage:
  size: 10Gi
  storageClassName: ""  # leave empty to use cluster default

service:
  api:
    type: ClusterIP
    port: 9000
  console:
    type: ClusterIP
    port: 9001

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"
