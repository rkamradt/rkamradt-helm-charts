replicaCount: 1

image:
  repository: ghcr.io/rkamradt/k8s-dashboard
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

resources:
  requests:
    memory: 64Mi
    cpu: 10m
  limits:
    memory: 128Mi
    cpu: 200m
